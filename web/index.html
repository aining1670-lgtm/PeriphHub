    <meta name="color-scheme" content="light dark" />
    <title>PeriphHub — 外设硬件控制台</title>
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('periphhub.theme') || 'system';
          var dark =
            mode === 'dark' ||
            (mode === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', !!dark);
        } catch (e) {}
      })();
    </script>
