<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>PeriphHub — 外设硬件控制台</title>
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('periphhub.theme') || 'system';
          var dark =
            mode === 'dark' ||
            (mode === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', !!dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-[var(--c-accent-soft)] selection:text-[var(--c-ink)]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
